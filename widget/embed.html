<!-- Parámetros: ?i=uf,dolar,utm&t=tarjetas|lista|fila&tema=oscuro|claro   (sin parámetros: solo la UF) -->
<div id="w" data-ic-widget></div>
<script>

    var q = new URLSearchParams(location.search), el = document.getElementById('w');
    el.setAttribute('data-i', q.get('i') || 'uf');

  })();
</script>
