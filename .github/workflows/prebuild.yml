name: Actualizar valores fallback SEO

on:
  schedule:
    # Día 1 de cada mes a las 13:00 UTC (10:00 hora Chile)
    - cron: '0 13 1 * *'
    # Día 10 de cada mes — IPC suele publicarse entre día 8-10
    - cron: '0 13 10 * *'

  # Ejecución manual desde GitHub Actions → pestaña Actions → "Run workflow"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fallback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Crear página mensual UF si no existe
        run: python create-monthly-uf-page.py

      - name: Actualizar valores fallback en HTML
        env:
          BCENTRAL_API_USER: ${{ secrets.BCENTRAL_API_USER }}
          BCENTRAL_API_PASS: ${{ secrets.BCENTRAL_API_PASS }}
          BCENTRAL_IPC_SERIES: ${{ secrets.BCENTRAL_IPC_SERIES }}
        run: python prebuild-fallback.py

      - name: Commit y push (si hubo cambios)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: actualizar valores fallback SEO (automatico)'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'

      - name: Notificar IndexNow (Bing) con URLs actualizadas
        run: |
          MESES=(enero febrero marzo abril mayo junio julio agosto septiembre octubre noviembre diciembre)
          MES_NUM=$(date +%-m)
          MES_NOMBRE=${MESES[$MES_NUM-1]}
          ANIO=$(date +%Y)
          MES_URL="https://indicadoreschile.cl/uf/${MES_NOMBRE}-${ANIO}/"
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"host\": \"indicadoreschile.cl\",
              \"key\": \"52cf498c33d348b8ba4f593067b4f3b0\",
              \"keyLocation\": \"https://indicadoreschile.cl/52cf498c33d348b8ba4f593067b4f3b0.txt\",
              \"urlList\": [
                \"https://indicadoreschile.cl/\",
                \"https://indicadoreschile.cl/uf/\",
                \"https://indicadoreschile.cl/dolar/\",
                \"https://indicadoreschile.cl/utm/\",
                \"https://indicadoreschile.cl/ipc/\",
                \"https://indicadoreschile.cl/calculadora-arriendo-uf/\",
                \"https://indicadoreschile.cl/reajuste-arriendo-ipc/\",
                \"https://indicadoreschile.cl/uf/${ANIO}/\",
                \"${MES_URL}\"
              ]
            }"
          echo "IndexNow notificado: ${MES_URL}"
